<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertar Sala</title>
</head>
<body>
    <h1>Insertar un nueva Sala</h1>
    <form action="/insertar-sala" method="post">
        <label for="id">ID Sala:</label>
        <input type="int" id="id" name="id" required>
        <br>

        <label for="cantButacas">Cantidad Butacas:</label>
        <input type="int" id="cantButacas" name="cantButacas" required>
        <br>

        <label for="nombreCine">Nombre del Cine perteneciente:</label>
        <input type="text" id="nombreCine" name="nombreCine" required>
        <br>

        <button type="submit">Insertar</button>
    </form>
</body>
</html>
